# Visiora — config Supabase (Edge Functions)
# Déploiement : supabase functions deploy generate-session-audio
# Secrets : ELEVENLABS_API_KEY (voix, déjà en place) et ANTHROPIC_ADMIN_KEY (clé d'admin Anthropic, à poser plus tard).

[edge_runtime]
policy = "per_worker"

[functions.generate-session-audio]
verify_jwt = true

[functions.list-eleven-voices]
verify_jwt = true

[functions.delete-own-account]
verify_jwt = true

[functions.admin-provider-usage]
verify_jwt = true




